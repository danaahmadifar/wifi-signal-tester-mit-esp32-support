; PlatformIO Project Configuration File for ESP32 WiFi Signal Tester
;
; Please visit documentation for other options and examples:
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Baudrate (USB Debugging)
monitor_speed = 115200

; Upload Speed
upload_speed = 921600

; Partition table: 'huge_app.csv' allocates ~3.14 MB for the app (no OTA), which easily fits Wi-Fi + Bluetooth Classic
board_build.partitions = huge_app.csv

; Build flags: Ensure Bluetooth Classic SPP and WiFi are fully enabled
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1
